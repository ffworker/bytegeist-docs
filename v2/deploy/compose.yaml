# Static site only. Builds happen outside this container with an approved
# private manifest. The host port MUST bind to its NetBird overlay address.
services:
  docs:
    image: caddy:2.10.2-alpine
    user: "10001:10001"
    ports:
      - "${NETBIRD_IPV4:?set_the_host_NetBird_IP}:${DOCS_PORT:-8085}:8080/tcp"
    volumes:
      - ../.generated/site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /config:rw,noexec,nosuid,size=4m,mode=1777
      - /data:rw,noexec,nosuid,size=4m,mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
