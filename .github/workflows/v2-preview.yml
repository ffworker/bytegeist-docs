name: Bytegeist Docs v2 local-only preview CI

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-preview.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-preview.yml'

permissions:
  contents: read

jobs:
  offline-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'mkdocs-material>=9.6,<10' zensical
      - name: Verify MkDocs Material preview (no private inputs)
        run: |
          cd v2
          mkdocs build --strict
          test -f site/index.html
          test -f site/styles/bytegeist.css
      - name: Verify Zensical preview with same mkdocs.yml (no deployment)
        run: |
          cd v2
          zensical build
          test -f site/index.html
          test -f site/styles/bytegeist.css
      - name: Confirm no network deployment or private inventory
        run: |
          ! grep -R -E 'DOCS_REPO_TOKEN|DOCS_NETBIRD_SETUP_KEY|/opt/bytegeist-docs|ffworker/homelab-talos' v2/
