name: Build documentation portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Retrieve declared repository documentation
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN || github.token }}
        run: python scripts/import_docs.py --clean
      - name: Build MkDocs strictly
        run: mkdocs build --strict -f .generated-mkdocs.yml
