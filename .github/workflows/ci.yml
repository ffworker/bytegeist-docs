name: Documentation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public:
    name: Public-safe strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/import_docs.py --clean --public
      - run: python scripts/assert_public_safe.py
      - run: mkdocs build --strict -f .generated-public-mkdocs.yml -d site-public
      - uses: actions/upload-artifact@v4
        with:
          name: bytegeist-docs-public-ci
          path: site-public/
          retention-days: 7

  private:
    name: Private/full strict build when credentials exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build private/full documentation when safe token is configured
        id: private
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'DOCS_REPO_TOKEN is not configured; private build is skipped on this PR.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/import_docs.py --clean
          mkdocs build --strict -f .generated-mkdocs.yml -d site-private
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.private.outputs.available == 'true'
        with:
          name: bytegeist-docs-private-ci
          path: site-private/
          retention-days: 2
