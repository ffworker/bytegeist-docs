name: Legacy MkDocs v1 source validation — retired

# Superseded by the Zensical v2 opt-in source collector and v2-preview.yml.
# The previous full build cloned 12 sources via DOCS_REPO_TOKEN on every push.
# There is intentionally no automatic private repo access here anymore.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain intentional retirement
        run: |
          echo 'Legacy v1 full-source validation is retired.'
          echo 'See Zensical v2 checks and explicit curated local sources.'
